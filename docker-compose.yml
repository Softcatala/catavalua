services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: catvoice-backend
    restart: unless-stopped
    networks:
      - traefik
      - catvoice-internal
    volumes:
      - catvoice-data:/data
    env_file:
      - ./apps/backend/.env.production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catvoice-backend.rule=Host(`${BACKEND_DOMAIN_PUBLIC}`) || Host(`${BACKEND_DOMAIN_INTERNAL}`)"
      - "traefik.http.routers.catvoice-backend.entrypoints=websecure"
      - "traefik.http.routers.catvoice-backend.tls=true"
      - "traefik.http.routers.catvoice-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.catvoice-backend.middlewares=compression@file"
      - "traefik.http.services.catvoice-backend.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Must be the publicly-reachable domain: this gets baked into the
        # JS bundle at build time and needs to resolve from any browser.
        VITE_API_BASE_URL: https://${BACKEND_DOMAIN_PUBLIC}
    container_name: catvoice-frontend
    restart: unless-stopped
    networks:
      - traefik
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catvoice-frontend.rule=Host(`${FRONTEND_DOMAIN_PUBLIC}`) || Host(`${FRONTEND_DOMAIN_INTERNAL}`)"
      - "traefik.http.routers.catvoice-frontend.entrypoints=websecure"
      - "traefik.http.routers.catvoice-frontend.tls=true"
      - "traefik.http.routers.catvoice-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.catvoice-frontend.middlewares=security-headers@file,compression@file"
      - "traefik.http.services.catvoice-frontend.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  traefik:
    external: true
  catvoice-internal:
    driver: bridge

volumes:
  catvoice-data:
    driver: local
